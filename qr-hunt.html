<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محطاتي | Connect Three</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .hunt-head{ text-align:center; margin-bottom:22px; }
  .hunt-ring{ position:relative; width:150px; height:150px; margin:0 auto 14px; }
  .hunt-ring svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .hunt-ring .val{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .hunt-ring .big{ font-family:var(--font-display); font-weight:800; font-size:38px; color:var(--gold); line-height:1; }
  .hunt-ring .sub{ font-size:11px; color:var(--mist-dim); margin-top:4px; }

  .st{
    display:flex; align-items:center; gap:14px; padding:16px 18px;
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--surface); margin-bottom:12px; position:relative; overflow:hidden;
  }
  .st .n{
    width:42px; height:42px; flex:0 0 42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:15px; font-weight:700;
    background:rgba(212,162,87,.10); color:var(--gold);
  }
  .st.found .n{ background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:#1A1206; }
  .st .info{ flex:1; min-width:0; }
  .st .t{ font-weight:700; font-size:15px; margin-bottom:3px; }
  .st .h{ font-size:12.5px; color:var(--mist-dim); line-height:1.6; }
  .st .p{ font-family:var(--font-mono); font-size:11px; color:var(--gold); white-space:nowrap; }
  .st.locked .t{ color:var(--mist-dim); }

  .scan-cta{ margin:22px 0 10px; }
  #camWrap{ display:none; margin-bottom:16px; }
  #camWrap video{ width:100%; border-radius:var(--radius); border:1px solid var(--gold); display:block; }
  .cam-hint{ text-align:center; font-size:12.5px; color:var(--mist-dim); margin-top:10px; }
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a href="dashboard.html" class="brand"><span class="dot"></span> Connect Three</a>
    <a href="dashboard.html" class="logout-link">رجوع</a>
  </div>

  <h1 class="display" style="font-size:20px;margin-bottom:4px">🗺️ رحلة المحطات</h1>
  <p style="font-size:13px;color:var(--mist-dim);margin-bottom:22px">
    دوّر على أكواد الـ QR المتخبّية في المؤتمر واعمللها سكان
  </p>

  <div class="card hunt-head">
    <div class="hunt-ring">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line-soft)" stroke-width="9"/>
        <circle id="ringFill" cx="60" cy="60" r="52" fill="none" stroke="var(--gold)"
                stroke-width="9" stroke-linecap="round"
                stroke-dasharray="326.7" stroke-dashoffset="326.7"
                style="transition:stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1)"/>
      </svg>
      <div class="val">
        <span class="big" id="foundN">0</span>
        <span class="sub">من <span id="totalN">0</span> محطة</span>
      </div>
    </div>
    <div id="huntMsg" style="font-size:13.5px;color:var(--mist-dim)">بنحمّل…</div>
  </div>

  <div class="scan-cta">
    <button class="btn" id="scanBtn">📷 افتح الكاميرا واعمل سكان</button>
    <div class="cam-hint">أو استخدم كاميرا موبايلك العادية على الـ QR — هتفتح على طول</div>
  </div>

  <div id="camWrap">
    <video id="cam" playsinline muted></video>
    <button class="btn outline" id="stopCam" style="margin-top:10px">إغلاق الكاميرا</button>
  </div>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseclient.js"></script>
<script src="js/auth.js"></script>
<script>
(function(){
  var member = null;
  try{ member = JSON.parse(localStorage.getItem('member')||'null'); }catch(e){}
  if(!member || !member.id){ location.href='index.html'; return; }

  var CIRC = 2 * Math.PI * 52;

  async function load(){
    try{
      var res = await supabase.rpc('get_my_qr_progress', { p_member_id: member.id });
      if(res.error) throw res.error;
      render(res.data || []);
    }catch(e){
      document.getElementById('huntMsg').textContent = 'مش قادر نحمّل المحطات دلوقتي';
    }
  }

  function render(rows){
    var total = rows.length;
    var found = rows.filter(function(r){ return r.found; }).length;
    document.getElementById('totalN').textContent = total;
    if(window.CTFX) window.CTFX.countTo(document.getElementById('foundN'), found, 900);
    else document.getElementById('foundN').textContent = found;

    setTimeout(function(){
      document.getElementById('ringFill').style.strokeDashoffset =
        total ? (CIRC - CIRC * (found/total)) : CIRC;
    }, 200);

    document.getElementById('huntMsg').textContent =
      !total ? 'لسه مفيش محطات متفعّلة' :
      (found === total ? '🎉 خلصت كل المحطات! جامد جدًا' :
       'فاضلك ' + (total - found) + ' محطة');

    var box = document.getElementById('list');
    box.innerHTML = '';
    rows.forEach(function(r, i){
      var d = document.createElement('div');
      d.className = 'st ' + (r.found ? 'found' : 'locked');
      d.innerHTML =
        '<div class="n">' + (r.found ? '✓' : (i+1)) + '</div>' +
        '<div class="info">' +
          '<div class="t">' + (r.found ? esc(r.title) : 'محطة مقفولة') + '</div>' +
          '<div class="h">' + esc(r.hint || (r.found ? '' : 'دوّر عليها في المؤتمر')) + '</div>' +
        '</div>' +
        (r.points ? '<div class="p">+' + r.points + '</div>' : '');
      box.appendChild(d);
    });

    if(total && found === total && window.CTFX) window.CTFX.confetti();
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ---------- in-app scanner (uses the browser's built-in detector) ---------- */
  var stream = null, scanning = false;
  document.getElementById('scanBtn').addEventListener('click', startCam);
  document.getElementById('stopCam').addEventListener('click', stopCam);

  async function startCam(){
    if(!('BarcodeDetector' in window)){
      if(window.CTFX) window.CTFX.toast('متصفحك مش بيدعم السكان جواه — استخدم كاميرا الموبايل العادية','bad');
      else alert('استخدم كاميرا الموبايل العادية على الـ QR');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    }catch(e){
      if(window.CTFX) window.CTFX.toast('مش قادر يفتح الكاميرا — اسمح بالإذن','bad');
      return;
    }
    var v = document.getElementById('cam');
    v.srcObject = stream; await v.play();
    document.getElementById('camWrap').style.display = 'block';
    scanning = true;
    var det = new window.BarcodeDetector({ formats:['qr_code'] });
    (async function tick(){
      if(!scanning) return;
      try{
        var codes = await det.detect(v);
        if(codes && codes.length){
          var raw = codes[0].rawValue || '';
          var code = extractCode(raw);
          if(code){ stopCam(); location.href = 'qr.html?c=' + encodeURIComponent(code); return; }
        }
      }catch(e){}
      requestAnimationFrame(tick);
    })();
  }
  function stopCam(){
    scanning = false;
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    document.getElementById('camWrap').style.display = 'none';
  }
  function extractCode(raw){
    try{
      var u = new URL(raw, location.href);
      return u.searchParams.get('c') || u.searchParams.get('code') || '';
    }catch(e){ return raw.trim(); }
  }
  window.addEventListener('pagehide', stopCam);

  load();
})();
</script>
<script src="js/vendor3d.min.js"></script>
<script src="js/experience.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
